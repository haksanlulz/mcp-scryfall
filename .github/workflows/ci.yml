name: CI

# The "a stranger clones this and runs npm test" channel. Until now this repo had
# no CI at all, so its suite only ever ran on the author's machine with whatever
# environment happened to be loaded there. That is not a channel, it is a habit —
# and the sibling mcp-fairrent shipped four red commits in a row precisely because
# a local shell variable masked a failure CI would have caught on the first push.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow checks out and tests, and needs no write scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines >=18, but the DEV toolchain floor is
        # higher than the runtime floor: vitest pulls a vite that requires
        # ^20.19 || >=22.12, so `npm ci` cannot install on 18 here. The server
        # itself runs under tsx, and the one build that exists (the .mcpb bundle,
        # below) is built on this same matrix -- so nothing proves 18, and the
        # bundle's manifest says >=20 for that reason.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Deliberately NOT `npm run smoke`: that one talks to the live Scryfall
      # API. Running it on every push would make this workflow's result depend
      # on a third party's uptime and would spend their rate limit for no
      # signal the mocked suite does not already give. Smoke stays a local rung.
      - run: npm test

  # The .mcpb bundle is a SECOND shipping path: its manifest points at emitted
  # JavaScript that a host runs with `node`, while every other rung drives the
  # TypeScript through tsx. Nothing else here would notice that path breaking --
  # the comment above about "no build step" stopped being true when the bundle
  # landed. This packs it and then drives the PACKED artifact over stdio.
  # Offline: the probe is initialize + tools/list, with no Scryfall call.
  bundle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run bundle
